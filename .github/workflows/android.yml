# Tests the CLI and phone core, builds the Android APK, and on a v* tag
# publishes a GitHub Release with the APK attached.
#
# Optional repository secrets for a stable signing key (without them the APK
# is signed with a throwaway debug key, and updates won't install over it):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BARE_KIT_VERSION: v2.5.5
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Bare Kit
        id: bare-kit
        uses: actions/cache@v4
        with:
          path: android/app/libs/bare-kit
          key: bare-kit-${{ env.BARE_KIT_VERSION }}

      - name: Fetch Bare Kit
        if: steps.bare-kit.outputs.cache-hit != 'true'
        run: scripts/fetch-bare-kit.sh "$BARE_KIT_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up the signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PEARBELL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test the app
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain
        env:
          PEARBELL_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}
          PEARBELL_VERSION_CODE: ${{ github.run_number }}
          PEARBELL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEARBELL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEARBELL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the APK
        run: |
          name="pearbell-${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pearbell-apk
          path: ${{ env.APK }}

      # release-plan makes the release with its changelog notes, so only add
      # the APK to it. A tag pushed by hand gets a new release.
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
