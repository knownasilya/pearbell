plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "org.jetbrains.kotlin.plugin.compose"
}

android {
  namespace = "dev.pearbell"
  compileSdk = 36

  defaultConfig {
    applicationId = "dev.pearbell"
    minSdk = 29
    targetSdk = 35
    // CI sets these: each build gets a higher code, so a new APK installs
    // over the old one.
    versionCode = (System.getenv("PEARBELL_VERSION_CODE") ?: "1").toInteger()
    versionName = (System.getenv("PEARBELL_VERSION") ?: "0.1.0").replaceFirst(/^v/, "")

    // Phones are arm64; x86_64 covers Intel emulators.
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
  }

  signingConfigs {
    release {
      def keystore = System.getenv("PEARBELL_KEYSTORE")
      if (keystore) {
        storeFile = file(keystore)
        storePassword = System.getenv("PEARBELL_KEYSTORE_PASSWORD")
        keyAlias = System.getenv("PEARBELL_KEY_ALIAS")
        keyPassword = System.getenv("PEARBELL_KEY_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled = false
      // Without a release key, fall back to the debug key so the APK still
      // installs. Android only accepts updates signed with the same key.
      signingConfig = System.getenv("PEARBELL_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  buildFeatures {
    compose = true
  }

  sourceSets {
    main {
      jniLibs.srcDirs "src/main/addons", "libs/bare-kit/jni"
    }
  }

  packaging {
    jniLibs {
      // Bare Kit loads addons by file name, so keep them unpacked on disk.
      useLegacyPackaging = true
    }
  }
}

// The worklet JS and its native addons come from the repo root, where the
// shared code and node_modules live.
def root = rootProject.projectDir.parentFile
def entry = "android/app/src/main/js/app.js"

tasks.register("linkAddons", Exec) {
  workingDir root
  inputs.file(new File(root, "package-lock.json"))
  outputs.dir("src/main/addons")
  commandLine "node_modules/.bin/bare-link", "--preset", "android", "--out", "android/app/src/main/addons", entry
}

tasks.register("packWorklet", Exec) {
  workingDir root
  inputs.dir(new File(root, "shared"))
  inputs.dir("src/main/js")
  outputs.file("src/main/assets/app.bundle")
  commandLine "node_modules/.bin/bare-pack", "--preset", "android", "--out", "android/app/src/main/assets/app.bundle", entry
}

preBuild.dependsOn linkAddons, packWorklet

dependencies {
  implementation fileTree(dir: "libs", include: ["bare-kit/classes.jar"])

  implementation platform("androidx.compose:compose-bom:2025.08.00")
  implementation "androidx.compose.material3:material3"
  implementation "androidx.compose.ui:ui"
  implementation "androidx.activity:activity-compose:1.10.1"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.2"
  implementation "androidx.core:core-ktx:1.16.0"
  implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}
